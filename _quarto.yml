project:
  type: book
  output-dir: docs

book:
  title: "CASA0023 Learning Diary"
  subtitle: "Remote Sensing, Urban Heat, and Earth Observation Practice"
  author: "ZheXiang Zhou"

  sidebar:
    collapse-level: 2
    style: docked
    background: light

  chapters:
    - index.qmd
    - intro.qmd
    - part: "Foundations (Weeks 1-3)"
      chapters:
        - week 1.qmd
        - week 2.qmd
        - week 3.qmd
    - part: "Policy Framing (Weeks 4-5)"
      chapters:
        - week 4&5.qmd
    - part: "Classification and Modelling (Weeks 6-8)"
      chapters:
        - week 6.qmd
        - week 7.qmd
        - week 8.qmd
    - part: "Urban Heat and Synthesis (Week 9)"
      chapters:
        - week 9.qmd
    - references.qmd

  page-footer:
    center: "CASA0023 | UCL Centre for Advanced Spatial Analysis"

bibliography: references.bib
csl: https://www.zotero.org/styles/apa

format:
  html:
    theme: [cosmo, custom.scss]
    toc: true
    toc-depth: 3
    number-sections: false
    code-fold: true
    code-tools: false
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
    link-external-newwindow: true
    grid:
      sidebar-width: 300px
      body-width: 920px
      margin-width: 250px

editor: visual
